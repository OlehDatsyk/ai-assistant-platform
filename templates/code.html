{% extends "base.html" %}
{% block title %}Code Assistant — AI Assistant Platform{% endblock %}
{% block page_title %}Code Assistant{% endblock %}
{% block content %}
<div class="grid grid-2">
  <div class="card">
    <label>Action</label>
    <select id="code-action">
      <option value="generate">Generate</option>
      <option value="explain">Explain</option>
      <option value="debug">Debug</option>
      <option value="refactor">Refactor</option>
      <option value="review">Review</option>
      <option value="test">Generate tests</option>
    </select>
    <div style="height:10px;"></div>
    <label>Language</label>
    <input id="code-language" value="python" />
    <div style="height:10px;"></div>
    <label>Code (leave empty for pure "generate")</label>
    <textarea id="code-input" rows="10" style="font-family: var(--font-mono); font-size:13px;"></textarea>
    <div style="height:10px;"></div>
    <label>Instructions / context</label>
    <textarea id="code-instructions" rows="2" placeholder="What should the code do, or what's the bug context?"></textarea>
    <div style="height:12px;"></div>
    <button class="btn btn-primary" onclick="runCode()">Run</button>
  </div>
  <div class="card">
    <div class="section-title" style="font-size:16px;">Result</div>
    <div id="code-result" class="muted">Output will appear here.</div>
  </div>
</div>
{% endblock %}
{% block scripts %}
<script>
async function runCode() {
  const action = document.getElementById('code-action').value;
  const language = document.getElementById('code-language').value;
  const code = document.getElementById('code-input').value;
  const instructions = document.getElementById('code-instructions').value;
  const out = document.getElementById('code-result');
  out.textContent = 'Working...';
  try {
    const data = await API.post('/api/code/run', { action, code, instructions, language, model_provider: 'openai' });
    out.innerHTML = `<pre style="white-space:pre-wrap; font-family: var(--font-mono); font-size:13px;">${data.result.replace(/</g,'&lt;')}</pre>`;
  } catch (e) {
    out.textContent = 'Error: ' + e.message;
  }
}
</script>
{% endblock %}
